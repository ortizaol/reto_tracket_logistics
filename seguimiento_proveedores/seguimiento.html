    ${cfg.proveedores.map((p, i) => `<tr data-i="${i}">
      <td><input type="text" data-f="proveedor" list="dlProv" value="${esc(p.proveedor)}" style="width:100%;min-width:340px"></td>
      <td><input type="text" data-f="alias" value="${esc(p.alias)}" size="10"></td>
      <td><select data-f="activo"><option ${p.activo !== 'NO' ? 'selected' : ''}>SI</option><option ${p.activo === 'NO' ? 'selected' : ''}>NO</option></select></td>
      <td><input type="text" data-f="contacto" value="${esc(p.contacto)}" size="16"></td>
      <td><input type="text" data-f="celular" value="${esc(p.celular)}" size="12"> ${p.celular && !celularWa(p.celular) ? '<span class="rojo peq">inválido</span>' : ''}</td>
      <td><input type="text" data-f="comprador" value="${esc(p.comprador)}" size="14"></td>
      <td><select data-f="trato"><option value="usted" ${p.trato !== 'tu' ? 'selected' : ''}>usted</option><option value="tu" ${p.trato === 'tu' ? 'selected' : ''}>tú</option></select></td>
      <td>${S.explosion ? (enEx[Object.keys(enEx).find(n => normH(n) === normH(p.proveedor))] ? '<span class="verde">✓ ' + enEx[Object.keys(enEx).find(n => normH(n) === normH(p.proveedor))] + ' líneas</span>' : '<span class="rojo">no aparece</span>') : ''}</td>
      <td><button class="b peq" data-adm="delProv">Quitar</button></td></tr>`).join('')}
    </table><p><button class="b" data-adm="addProv">Agregar proveedor</button></p>
    ${faltantes.length ? `<details><summary class="peq">${faltantes.length} proveedor(es) nacionales de la explosión no están en la configuración</summary>
      <table>${faltantes.map(n => `<tr><td>${esc(n)}</td><td class="n">${enEx[n]} líneas</td><td><button class="b peq" data-adm="addEx" data-nombre="${esc(n)}">Agregar (inactivo)</button></td></tr>`).join('')}</table></details>` : ''}
  </div>`;
  // Reglas
  h += `<div class="panel"><h2>Reglas</h2><table style="max-width:1000px"><tr><th>Parámetro</th><th>Valor</th><th>Descripción</th></tr>
    ${Object.keys(REGLAS_DEF).map(k => `<tr><td><code>${k}</code></td><td><input type="text" data-regla="${k}" value="${esc(rg[k])}" size="${/nombre|prefijos/.test(k) ? 22 : 10}"></td><td class="peq mut">${esc(REGLAS_DESC[k])}</td></tr>`).join('')}
    </table><p class="peq mut">Valores efectivos: horizonte ${R().horizonte_semanas} semanas · repregunta ${R().dias_antes_repregunta.join(', ')} días antes · vencidas cada ${R().frecuencia_vencidas_dias} días · recordatorio a las ${R().horas_sin_respuesta_para_recordatorio} h.</p></div>`;
  // Plantillas
  const provSel = ADM.prevProv || ((cfg.proveedores[0] || {}).proveedor || '');
  h += `<div class="panel"><h2>Plantillas</h2>
    <p class="peq mut">Campos: <code>{contacto}</code> <code>{comprador}</code> <code>{detalle}</code> <code>{n_lineas}</code> <code>{formato}</code> (instrucciones de respuesta según las líneas). Si falta, se agrega al final: «${esc(AVISO_PLATAFORMA)}».</p>
    <table><tr><th>Plantilla</th><th>Usted</th><th>Tú</th></tr>
    ${PLANTILLAS_NOMBRES.map(k => `<tr><td><code>${k}</code></td>
      <td><textarea data-pl="${k}" data-trato="usted" rows="7">${esc(cfg.plantillas[k].usted)}</textarea></td>
      <td><textarea data-pl="${k}" data-trato="tu" rows="7">${esc(cfg.plantillas[k].tu)}</textarea></td></tr>`).join('')}</table>
    <h3>Vista previa con datos reales</h3>
    <div class="fila"><select id="pvProv">${cfg.proveedores.map(p => `<option value="${esc(p.proveedor)}" ${p.proveedor === provSel ? 'selected' : ''}>${esc(p.alias || p.proveedor)}</option>`).join('')}</select>
      <select id="pvPl">${PLANTILLAS_NOMBRES.map(k => `<option ${k === (ADM.prevPl || 'primera_solicitud') ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <select id="pvTrato"><option value="">trato del proveedor</option><option value="usted" ${ADM.prevTrato === 'usted' ? 'selected' : ''}>usted</option><option value="tu" ${ADM.prevTrato === 'tu' ? 'selected' : ''}>tú</option></select></div>
    <pre class="msg" id="pvMsg">${esc(previaPlantilla())}</pre></div>`;
  // Exclusiones
  h += `<div class="panel"><h2>Exclusiones</h2><p class="peq mut">OC, ítems o líneas que no se deben preguntar. Tipo LINEA: valor «OC-12345|10» (OC|línea).</p>
    <table style="max-width:900px"><tr><th>Tipo</th><th>Valor</th><th>Motivo</th><th></th></tr>
    ${cfg.exclusiones.map((x, i) => `<tr data-x="${i}"><td><select data-xf="tipo">${['OC','ITEM','LINEA'].map(t => `<option ${t === x.tipo ? 'selected' : ''}>${t}</option>`).join('')}</select></td>
      <td><input type="text" data-xf="valor" value="${esc(x.valor)}"></td><td><input type="text" data-xf="motivo" value="${esc(x.motivo)}" style="width:100%"></td>
      <td><button class="b peq" data-adm="delEx">Quitar</button></td></tr>`).join('')}
    </table><p><button class="b" data-adm="addExc">Agregar exclusión</button></p></div>`;
  return h;
}
function enlazarAdmin(){
  if (!admDesbloqueado()){
    const go = () => {
      if ($('#admPin').value === R().pin_admin){ try{ sessionStorage.setItem('segprov.adm', '1'); }catch(e){ ADM.ok = true; } renderTodo(); }
      else alert('PIN incorrecto.');
    };
    $('#admEntrar').onclick = go; $('#admPin').onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  const cfg = S.config;
  $('#admSimOk').onclick = () => { const v = $('#admSim').value; if (!v){ alert('Elija una fecha.'); return; } aplicarFechaSimulada(v); S.avisos = ['Fecha simulada: ' + fmtF(v) + '.']; if (ULTIMA_CARGA) procesar(ULTIMA_CARGA); else renderTodo(); };
  $('#admSimNo').onclick = () => { aplicarFechaSimulada(''); S.avisos = ['Se volvió a la fecha real.']; if (ULTIMA_CARGA) procesar(ULTIMA_CARGA); else renderTodo(); };
  $('#admSalir').onclick = () => { try{ sessionStorage.removeItem('segprov.adm'); }catch(e){} ADM.ok = false; renderTodo(); };
  $('#admExportar').onclick = async () => {
    if (S.dirHandle && !confirm('Se sobrescribirá config.xlsx en la carpeta «' + S.dirHandle.name + '». ¿Continuar?')) return;
    const donde = await guardarLibro(libroConfig(cfg), 'config.xlsx', '');
    lsSet(LS.config, { config:cfg, sucia:false, ts:Date.now() }); S.configLocalSucia = false;
    S.configFuente = 'config.xlsx (exportado ' + fmtFH(ahora()) + ')';
    S.avisos = [donde === 'carpeta' ? 'config.xlsx actualizado en la carpeta.' : 'config.xlsx descargado: reemplace el archivo en la carpeta de OneDrive.'];
    renderTodo();
  };
  $('#admDescartar').onclick = async () => {
    if (!confirm('¿Descartar los cambios locales y volver a config.xlsx?')) return;
    try{ localStorage.removeItem(LS.config); }catch(e){}
    if (ULTIMA_CARGA) await procesar(ULTIMA_CARGA); else { S.config = configDefecto(); renderTodo(); }
  };
  const main = $('#main');
  main.onchange = e => {
    const t = e.target;
    const tr = t.closest('tr');
    if (t.dataset.f && tr && tr.dataset.i != null){
      cfg.proveedores[+tr.dataset.i][t.dataset.f] = t.dataset.f === 'proveedor' ? t.value.trim().replace(/\s+/g, ' ') : t.value.trim();
      guardarConfigLocal(); renderTodo();
    } else if (t.dataset.regla){ cfg.reglas[t.dataset.regla] = t.value.trim(); guardarConfigLocal(); renderTodo(); }
    else if (t.dataset.xf && tr){ cfg.exclusiones[+tr.dataset.x][t.dataset.xf] = t.dataset.xf === 'tipo' ? t.value : t.value.trim(); guardarConfigLocal(); }
    else if (t.id === 'pvProv'){ ADM.prevProv = t.value; $('#pvMsg').textContent = previaPlantilla(); }
    else if (t.id === 'pvPl'){ ADM.prevPl = t.value; $('#pvMsg').textContent = previaPlantilla(); }
    else if (t.id === 'pvTrato'){ ADM.prevTrato = t.value; $('#pvMsg').textContent = previaPlantilla(); }
  };
  main.oninput = e => {
    const t = e.target;
    if (t.dataset.pl){
      cfg.plantillas[t.dataset.pl][t.dataset.trato] = t.value;
      ADM.prevPl = t.dataset.pl; if (!ADM.prevTrato) ADM.prevTrato = t.dataset.trato;
      $('#pvPl').value = t.dataset.pl; $('#pvMsg').textContent = previaPlantilla();
      guardarConfigLocal();
    }
  };
  main.onclick = e => {
    const a = e.target.dataset && e.target.dataset.adm; if (!a) return;
    const tr = e.target.closest('tr');
    if (a === 'addProv') cfg.proveedores.push({ proveedor:'', alias:'', activo:'SI', contacto:'', celular:'', comprador:'', trato:'usted' });
    else if (a === 'delProv'){ if (!confirm('¿Quitar este proveedor de la configuración?')) return; cfg.proveedores.splice(+tr.dataset.i, 1); }
    else if (a === 'addEx') cfg.proveedores.push({ proveedor:e.target.dataset.nombre, alias:'', activo:'NO', contacto:'', celular:'', comprador:'', trato:'usted' });
    else if (a === 'addExc') cfg.exclusiones.push({ tipo:'OC', valor:'', motivo:'' });
    else if (a === 'delEx') cfg.exclusiones.splice(+tr.dataset.x, 1);
    else return;
    guardarConfigLocal(); renderTodo();
  };
}

   Arranque
   ========================================================================= */
function enlazarGlobal(){
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderTodo(); });
  $('#btnCarpeta').onclick = conectarCarpeta;
  $('#btnReconectar').onclick = reconectarCarpeta;
  $('#btnArchivos').onclick = () => $('#inpArchivos').click();
  $('#inpArchivos').onchange = e => { if (e.target.files.length) cargarArchivosSueltos(e.target.files); e.target.value = ''; };
  $('#btnRecargar').onclick = async () => {
    if (S.dirHandle) await cargarDesdeCarpeta();
    else if (ULTIMA_CARGA) await procesar(ULTIMA_CARGA);
    else renderTodo();
  };
  $('#selComprador').onchange = e => {
    let v = e.target.value;
    if (v === '__otro__'){ v = (prompt('Nombre del comprador:') || '').trim(); }
    S.comprador = v; lsSet(LS.comprador, v); renderTodo(); if (S.modificadas.size) guardadoAutomatico();
  };
}
async function init(){
  enlazarGlobal();
  if (!window.XLSX){ $('#main').innerHTML = '<div class="error">No se pudo cargar SheetJS (sin internet o CDN bloqueado). Copie <b>xlsx.full.min.js</b> en la misma carpeta de este archivo.</div>'; return; }
  const h = await idbGet('carpeta');
  if (h){
    try{
      if ((await h.queryPermission({ mode:'readwrite' })) === 'granted'){ S.dirHandle = h; await cargarDesdeCarpeta(); return; }
    }catch(e){}
    const b = $('#btnReconectar'); b.textContent = 'Reconectar «' + h.name + '»'; b.classList.remove('oculto');
  }
  const local = lsGet(LS.config, null); if (local){ S.config = local.config; S.configFuente = 'guardada en este navegador'; }
  S.avisos = ['Conecte la carpeta de OneDrive del seguimiento (Edge/Chrome) o use «Cargar archivos…» para seleccionar la explosión, config.xlsx y los archivos de respuestas/.'];
  renderTodo();
}

  conciliar, procesar, elegirExplosion, fechaDeNombreExplosion, detectarColumnas, setAhora, hoy, ahora, diasEntre, addDias,
  revisarAlmacen, enRiesgo, renderTodo, evaluarLinea, gestionHoy, plantillaPara, construirMensaje, ctxProveedor, separarWhatsApp, identificarRemitente, analizarPegado, confirmarPanel, deshacerUltima, ultimoLote, mensajesVigentes, guardadoAutomatico, aplicarFechaSimulada, fechaSimulada, archivoDelDia,
  interpretarNatural, loteMensaje, numerarPorOC, detalleMensaje, fechaPalabras, metricasProveedores, lineasRiesgo, lineasCambios, libroTablero, historialFechas, validarAccion, aplicarAccion, registrarPregunta, datosMiSeguimiento, lineasDeMensaje, fechaRespuesta, vencida };
init();
